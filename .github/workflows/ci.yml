name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Unit Tests & Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify whitespace and formatting
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run automated unit & protocol tests
        run: npm test

      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run multi-viewport responsive checks
        run: npm run test:viewports

      - name: Run interaction test suite
        run: npm run test:interactions

      - name: Run browser smoke tests & screenshot capture
        run: npm run test:smoke

      - name: Upload screenshots as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: docs/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
